<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registro - Galpón Proyecto</title>
    <style>
        :root {
            --verde: #28a745;
            --verde-oscuro: #1e7e34;
            --verde-claro: #e8f5e9;
            --rojo: #dc3545;
            --rojo-claro: #f8d7da;
            --rojo-texto: #721c24;
            --texto: #1f2933;
            --texto-suave: #6b7280;
            --borde: #e3e8ee;
            --fondo: #f0f2f5;
            --radio: 14px;
            --sombra: 0 10px 30px rgba(16, 24, 40, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 10% 0%, #e6f7ec 0%, transparent 45%),
                radial-gradient(circle at 90% 100%, #e0f2fe 0%, transparent 45%),
                var(--fondo);
            background-attachment: fixed;
            color: var(--texto);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: var(--radio);
            box-shadow: var(--sombra);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: aparecer 0.45s ease both;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--verde-oscuro);
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: -0.4px;
            margin: 0 0 8px;
        }

        h1::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            margin: 14px auto 0;
            border-radius: 99px;
            background: linear-gradient(90deg, #7de6bb, var(--verde));
        }

        /* ---------- Mensajes ---------- */
        .mensaje-error {
            background: var(--rojo-claro);
            color: var(--rojo-texto);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.92rem;
            font-weight: 600;
            border-left: 5px solid var(--rojo);
            animation: aparecer 0.3s ease both;
        }

        /* ---------- Formulario ---------- */
        form {
            margin: 25px 0 0;
            padding: 24px;
            background: #fafbfc;
            border: 1px solid var(--borde);
            border-radius: var(--radio);
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #374151;
            letter-spacing: 0.1px;
        }

        label:first-of-type { margin-top: 0; }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            margin-top: 7px;
            border: 1.5px solid var(--borde);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--texto);
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="text"]:hover,
        input[type="number"]:hover { border-color: #cbd5e1; }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--verde);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.15);
        }

        input::placeholder { color: #9aa5b1; }

        /* ---------- Botones ---------- */
        .acciones-form {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 26px;
        }

        button {
            flex: 1 1 auto;
            padding: 13px 22px;
            background: linear-gradient(135deg, #34c759, var(--verde));
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.32);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(40, 167, 69, 0.38);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }

        .cancelar {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            background: #f1f5f9;
            color: #374151;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1.5px solid var(--borde);
            border-radius: 10px;
            transition: all 0.18s ease;
        }

        .cancelar:hover {
            background: #e6ebf1;
            border-color: #cbd5e1;
            color: var(--texto);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(16, 24, 40, 0.08);
        }

        .cancelar:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .container { padding: 22px 18px; border-radius: 12px; }
            form { padding: 18px; }
            h1 { font-size: 1.3rem; }

            .acciones-form { flex-direction: column; align-items: stretch; }
            button, .cancelar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ Editar Registro de Producción</h1>

        {% if messages %}
          {% for message in messages %}
            <div class="mensaje-error">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="cantidad_huevos">Cantidad de huevos recolectados:</label>
            <input type="text" inputmode="numeric" id="cantidad_huevos" name="cantidad_huevos" value="{{ registro.cantidad_huevos }}" placeholder="Ej: 1200">

            <label for="cantidad_huevos_rotos">Cantidad de huevos rotos:</label>
            <input type="text" inputmode="numeric" id="cantidad_huevos_rotos" name="cantidad_huevos_rotos" value="0" placeholder="Ej: 0">

            <label for="cantidad_cubetas">Número de cubetas armadas:</label>
            <input type="text" inputmode="numeric" id="cantidad_cubetas" name="cantidad_cubetas" value="{{ registro.cantidad_cubetas }}" placeholder="Ej: 40">

            <div class="acciones-form">
                <button type="submit">Guardar cambios</button>
                <a class="cancelar" href="{% url 'registrar_produccion' %}">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

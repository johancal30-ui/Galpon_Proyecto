
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar registro</title>

    <style>
        :root {
            --sol: #F7C948;
            --naranja: #F29E4C;
            --naranja-fuerte: #E8892B;
            --tinta: #3B2412;
            --suave: #7A5A3A;
            --fondo: #FFF6E3;
            --tarjeta: #FFEEDB;
            --borde: #F0C48A;
            --cresta: #C0392B;
            --radio: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--tinta);
            line-height: 1.5;
            background: linear-gradient(180deg, var(--sol) 0, var(--naranja) 220px, var(--fondo) 220px);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: var(--tarjeta);
            border: 2px solid var(--borde);
            border-radius: var(--radio);
            box-shadow: 0 10px 28px rgba(150, 90, 30, 0.15);
            padding: 36px;
        }

        h1 {
            font-family: Rockwell, "Roboto Slab", Georgia, serif;
            text-align: center;
            font-size: 1.8rem;
            margin: 20px 0 8px;
            color: var(--tinta);
        }

        h1::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            margin: 14px auto 0;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--sol), var(--naranja-fuerte));
        }

        .volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: #FFFAF2;
            color: var(--tinta);
            font-weight: 700;
            font-size: .9rem;
            text-decoration: none;
            border: 2px solid var(--borde);
            border-radius: 20px;
            transition: all .2s ease;
        }

        .volver:hover {
            background: var(--sol);
            border-color: var(--naranja);
            transform: translateY(-2px);
        }

        .mensaje {
            margin: 24px 0;
            padding: 24px;
            background: #FFFAF2;
            border: 2px solid var(--borde);
            border-radius: var(--radio);
            text-align: center;
        }

        .mensaje p {
            font-size: 1rem;
            color: var(--suave);
            margin: 10px 0;
        }

        .detalles {
            margin: 20px 0;
            padding: 18px;
            background: white;
            border: 2px solid var(--borde);
            border-radius: 10px;
            text-align: left;
        }

        .detalles p {
            margin: 8px 0;
            color: var(--tinta);
        }

        .acciones-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .btn {
            flex: 1 1 180px;
            display: inline-block;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            text-align: center;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .btn-eliminar {
            background: var(--cresta);
            color: white;
            box-shadow: 0 6px 16px rgba(192, 57, 43, 0.25);
        }

        .btn-eliminar:hover {
            background: #A93226;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(192, 57, 43, 0.35);
        }

        .btn-gris {
            background: #FFFAF2;
            color: var(--tinta);
            border: 2px solid var(--borde);
            box-shadow: none;
        }

        .btn-gris:hover {
            background: var(--fondo);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 22px 16px;
            }

            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="javascript:history.back()" class="volver">← Volver</a>

    <h1>Eliminar registro</h1>

    <div class="mensaje">
        <p>¿Estás seguro de que deseas eliminar este registro?</p>
        <p>Esta acción no se puede deshacer.</p>

        <div class="detalles">
            <!-- Mantén aquí los datos que ya mostrabas en tu HTML anterior -->
            <p><strong>Registro:</strong> {{ registro }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="acciones-form">
                <button type="submit" class="btn btn-eliminar">
                    Sí, eliminar
                </button>

                <a href="javascript:history.back()" class="btn btn-gris">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

</div>

</body>
</html>

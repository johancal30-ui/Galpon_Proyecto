<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #f8c444, #f0a050); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #3a2210; }
        .container { background: #feeedd; padding: 40px; border: 2px solid #f5cfa8; border-radius: 18px; box-shadow: 0 14px 34px rgba(120,70,20,0.25); width: 100%; max-width: 420px; }
        h1 { text-align: center; font-family: "Courier New", monospace; font-size: 26px; color: #3a2210; }
        p { color: #7a5f4a; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #f5cfa8; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #e8892b; box-shadow: 0 0 0 4px rgba(240,160,80,0.3); }
        button { width: 100%; padding: 13px; background: #3a2210; color: #fff8e8; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 700; }
        button:hover { background: #e8892b; color: white; }
        .link { text-align: center; margin-top: 20px; font-size: 13px; }
        a { color: #e8892b; font-weight: 700; text-decoration: none; }
        a:hover { color: #3a2210; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Recuperar Contraseña</h1>
        <p>Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.</p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <button type="submit">Enviar enlace</button>
        </form>
        <div class="link">
            <a href="{% url 'accounts:login' %}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>

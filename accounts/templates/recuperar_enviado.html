<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #f8c444, #f0a050); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #3a2210; }
        .container { background: #feeedd; padding: 40px; border: 2px solid #f5cfa8; border-radius: 18px; box-shadow: 0 14px 34px rgba(120,70,20,0.25); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-family: "Courier New", monospace; font-size: 28px; color: #3a2210; }
        p { color: #7a5f4a; }
        a { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #3a2210; color: #fff8e8; font-weight: 700; text-decoration: none; border-radius: 10px; }
        a:hover { background: #e8892b; color: white; }
    </style>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include "includes/accessibility.html" %}
</head>
<body>
    <div class="container">
        <h1>📧 ¡Correo Enviado!</h1>
        <p>Se ha enviado un enlace para restablecer tu contraseña a tu correo electrónico.</p>
        <p>Revisa tu bandeja de entrada (y la carpeta de spam).</p>
        <a href="{% url 'accounts:login' %}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
